<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculus: Differentiation Rules</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <style>
        :root {
            --level1: #e67e22; 
            --level2: #3498db;
            --level3: #9b59b6;
            --dark: #2c3e50;
            --light: #f8f9fa;
            --secondary: #3498db;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f7;
            color: var(--dark);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 90vh;
            user-select: none;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            max-width: 850px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: var(--dark);
            font-size: 26px;
            margin-top: 0;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 15px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        /* --- Menu Layout --- */
        #menuScreen { display: block; }
        
        .level-section {
            margin-bottom: 25px;
            padding: 20px;
            border-radius: 10px;
            text-align: left;
            background: white;
            border: 2px solid var(--level1);
        }
        
        .level-section.lvl-3 { border-color: var(--level3); }

        .level-title { 
            background: var(--level1); 
            color: white; 
            display: inline-block; 
            padding: 5px 15px; 
            border-radius: 5px; 
            margin-top: -35px; 
            margin-bottom: 15px; 
            font-weight: bold; 
        }
        
        .lvl-3 .level-title { background: var(--level3); }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .menu-btn {
            background-color: var(--light);
            color: var(--dark);
            border: 2px solid #bdc3c7;
            padding: 12px 18px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            display: flex;
            align-items: center;
        }

        .menu-btn span {
            background-color: var(--secondary);
            color: white;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin-right: 12px;
            font-size: 13px;
            flex-shrink: 0;
        }
        
        .lvl-3 .menu-btn span { background-color: var(--level3); }

        .menu-btn:hover {
            background-color: var(--secondary);
            color: white;
            border-color: var(--secondary);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3);
        }
        
        .lvl-3 .menu-btn:hover { background-color: var(--level3); border-color: var(--level3); }

        /* --- Game Screen --- */
        #gameScreen { display: none; animation: fadeIn 0.3s ease; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .icon-btn {
            background-color: #ecf0f1;
            color: #7f8c8d;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .icon-btn:hover { background-color: #e0e6ed; }

        .streak-counter {
            font-size: 15px;
            font-weight: bold;
            color: var(--secondary);
            background: #ebf5fb;
            padding: 8px 15px;
            border-radius: 10px;
            border: 2px solid var(--secondary);
        }

        .prompt-text {
            font-size: 18px;
            color: var(--dark);
            font-weight: bold;
            margin-bottom: 10px;
        }

        .problem-display {
            font-size: 26px; 
            margin: 0 auto 20px auto;
            padding: 15px 25px;
            background-color: #fdfbf7;
            border-radius: 12px;
            border: 2px solid var(--level1);
            color: var(--dark);
            min-height: 80px;
            display: block; 
            text-align: center;
            transition: all 0.3s;
            line-height: 1.6;
            max-width: 650px;
            word-wrap: break-word;
        }
        
        .problem-display.error {
            background-color: #fadbd8;
            border-color: #e74c3c;
            animation: shake 0.4s;
        }

        .info-box {
            background-color: white;
            border: 2px dashed #bdc3c7;
            border-radius: 12px;
            padding: 15px;
            width: 100%;
            max-width: 500px;
            margin: 0 auto 20px auto;
            display: none;
            justify-content: center;
            overflow-x: auto;
        }

        /* Abstract Tables */
        .calc-table {
            border-collapse: collapse;
            font-size: 20px;
            width: 100%;
            background: white;
        }
        .calc-table th, .calc-table td {
            border: 2px solid #bdc3c7;
            padding: 8px;
            text-align: center;
        }
        .calc-table th { background-color: #ecf0f1; color: var(--dark); }

        #errorAlert {
            display: none;
            color: #c0392b;
            font-weight: bold;
            margin-bottom: 15px;
            padding: 10px;
            background: #fadbd8;
            border-radius: 8px;
        }

        .options-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            width: 100%;
            max-width: 750px;
            margin: 0 auto;
        }

        .option-btn {
            flex: 1 1 calc(50% - 12px); 
            background-color: white;
            color: var(--dark);
            border: 2px solid #bdc3c7;
            padding: 15px 10px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 0 #bdc3c7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 55px;
            text-align: center;
            line-height: 1.3;
        }
        
        .option-btn.full-width {
            flex: 1 1 100%;
        }

        .option-btn:hover {
            background-color: #f0f8ff;
            border-color: var(--secondary);
            transform: translateY(2px);
            box-shadow: 0 2px 0 var(--secondary);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: none;
        }

        .option-btn.correct {
            background-color: #e8f8f5 !important;
            border-color: #27ae60 !important;
            color: #27ae60 !important;
            box-shadow: 0 4px 0 #2ecc71 !important;
        }

        .option-btn.wrong {
            background-color: #fadbd8 !important;
            border-color: #c0392b !important;
            color: #c0392b !important;
            box-shadow: 0 2px 0 #e74c3c !important;
            transform: translateY(2px);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }

        .confetti {
            position: absolute;
            font-size: 30px;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            z-index: 100;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.5); }
        }

        @media (max-width: 600px) {
            .menu-grid { grid-template-columns: 1fr; }
            .option-btn { flex: 1 1 100%; font-size: 18px; padding: 12px 5px;} 
            .problem-display { font-size: 22px; padding: 15px 10px; } 
        }
    </style>
</head>
<body>

<div class="container">
    
    <div id="menuScreen">
        <h1>Calculus: Derivatives</h1>
        <p class="subtitle">Differentiation Rules & Applications</p>
        
        <div class="level-section">
            <div class="level-title">Level 1 to Level 2</div>
            <div class="menu-grid">
                <button class="menu-btn" onclick="startGame(1)"><span>1</span> Power Rule</button>
                <button class="menu-btn" onclick="startGame(2)"><span>2</span> Product Rule</button>
                <button class="menu-btn" onclick="startGame(3)"><span>3</span> Quotient Rule</button>
                <button class="menu-btn" onclick="startGame(4)"><span>4</span> Chain Rule</button>
                <button class="menu-btn" onclick="startGame(5)" style="grid-column: 1 / -1;"><span>5</span> Implicit Differentiation</button>
            </div>
        </div>

        <div class="level-section lvl-3">
            <div class="level-title">Level 3 to Level 4</div>
            <div class="menu-grid">
                <button class="menu-btn" onclick="startGame(6)"><span>6</span> Multiple Rules (Unsimplified)</button>
                <button class="menu-btn" onclick="startGame(7)"><span>7</span> Abstract Rules (Table of Values)</button>
                <button class="menu-btn" onclick="startGame(8)" style="grid-column: 1 / -1;"><span>8</span> Applications: Tangent Lines & Slope</button>
            </div>
        </div>
    </div>

    <div id="gameScreen">
        <div class="game-header">
            <div>
                <button class="icon-btn" onclick="showMenu()">&#128281; Menu</button>
            </div>
            <div class="streak-counter">&#128293; Streak: <span id="streakDisplay">0</span> | &#127942; Best: <span id="highStreakDisplay">0</span></div>
        </div>

        <div id="errorAlert"></div>

        <div class="prompt-text" id="promptTitle">Find the derivative:</div>
        
        <div class="info-box" id="infoBox"></div>
        <div class="problem-display" id="problemDisplay"></div>

        <div class="options-grid" id="optionsGrid"></div>
    </div>

</div>

<script>
    let currentMode = 1;
    let currentStreak = 0;
    let highestStreak = 0; 
    let isTransitioning = false;
    let lastPrompt = "";

    // --- Audio System ---
    let audioCtx;
    function lazyInitAudio() { 
        if (audioCtx) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
            try {
                audioCtx = new AudioContext(); 
                if (audioCtx.state === 'suspended') audioCtx.resume(); 
            } catch(e) {}
        }
    }
    function playTone(freq, type, duration, vol) {
        lazyInitAudio();
        if (!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }
    function playSuccess() { playTone(523.25, 'triangle', 0.15, 0.3); setTimeout(() => playTone(659.25, 'triangle', 0.2, 0.3), 100); setTimeout(() => playTone(783.99, 'triangle', 0.4, 0.3), 200); }
    function playWrong() { playTone(200, 'sine', 0.3, 0.3); }

    // --- Math Utility ---
    function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
    function getRandomEl(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function getRandomNonZero(min, max) {
        let val; do { val = Math.floor(Math.random() * (max - min + 1)) + min; } while (val === 0); return val;
    }
    function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
    function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while(b) { let t = b; b = a % b; a = t; } return a || 1; }

    function simplifyFrac(n, d) {
        if (n === 0) return [0, 1];
        if (d === 0) return [1, 0]; // Prevent infinite loops
        let g = gcd(n, d);
        n /= g; d /= g;
        if (d < 0) { n = -n; d = -d; }
        return [n, d];
    }

    function formatFrac(n, d) {
        let [nn, dd] = simplifyFrac(n, d);
        if (dd === 1) return nn.toString();
        if (nn === 0) return "0";
        if (nn < 0) return `-\\frac{${Math.abs(nn)}}{${dd}}`;
        return `\\frac{${nn}}{${dd}}`;
    }

    // --- Extended Rational Exponent Formatter (Modes 1, 2, 3) ---
    function formatTermExt(cNum, cDen, pn, pd, isFirst) {
        if (cNum === 0) return "";
        let sign = cNum * cDen < 0 ? (isFirst ? "-" : " - ") : (isFirst ? "" : " + ");
        let num = Math.abs(cNum);
        let den = Math.abs(cDen);
        let [cn, cd] = simplifyFrac(num, den);
        
        let cStr = "";
        if (cd === 1) {
            cStr = (cn === 1 && pn !== 0) ? "" : cn.toString();
        } else {
            cStr = `\\frac{${cn}}{${cd}}`;
        }
        
        let pStr = "";
        if (pn !== 0) {
            let [pn_s, pd_s] = simplifyFrac(pn, pd);
            if (pd_s === 1) {
                if (pn_s === 1) pStr = "x";
                else pStr = `x^{${pn_s}}`;
            } else if (pn_s === 1 && pd_s === 2) {
                pStr = `\\sqrt{x}`; // Display radical elegantly
            } else {
                pStr = `x^{${pn_s}/${pd_s}}`;
            }
        }
        return `${sign}${cStr}${pStr}`;
    }

    function formatPolyExt(terms) {
        let res = "";
        let first = true;
        for (let t of terms) {
            if (t.cn !== 0) {
                res += formatTermExt(t.cn, t.cd, t.pn, t.pd, first);
                first = false;
            }
        }
        return res === "" ? "0" : res;
    }

    function polyDerivExt(terms) {
        let d = [];
        for(let t of terms) {
            if (t.pn !== 0) {
                let [nn, nd] = simplifyFrac(t.cn * t.pn, t.cd * t.pd);
                let [npn, npd] = simplifyFrac(t.pn - t.pd, t.pd);
                if (nn !== 0) d.push({cn: nn, cd: nd, pn: npn, pd: npd});
            }
        }
        if (d.length === 0) return [{cn: 0, cd: 1, pn: 0, pd: 1}];
        return d;
    }

    // --- Standard Integer Polynomial Formatter (Modes 4, 6, 8) ---
    function termFmt(c, p, v='x', isFirst=false) {
        if (c === 0) return "";
        let absC = Math.abs(c);
        let sign = (c < 0) ? (isFirst ? "-" : " - ") : (isFirst ? "" : " + ");
        
        let vPart = "";
        if (p === 1) vPart = v;
        else if (p !== 0) vPart = `${v}^{${p}}`;
        
        let cPart = "";
        // Only show 1 if power is 0 (constant term)
        if (absC !== 1 || p === 0) cPart = absC.toString();
        
        return `${sign}${cPart}${vPart}`;
    }

    function polyFmt(terms, v='x') {
        let filtered = terms.filter(t => t[0] !== 0);
        if (filtered.length === 0) return "0";
        filtered.sort((a,b) => b[1] - a[1]);
        
        let res = termFmt(filtered[0][0], filtered[0][1], v, true);
        for(let i=1; i<filtered.length; i++){
            res += termFmt(filtered[i][0], filtered[i][1], v, false);
        }
        return res;
    }

    function polyDeriv(terms) {
        let d = terms.map(t => [t[0]*t[1], t[1]-1]).filter(t => t[0] !== 0);
        if (d.length === 0) return [[0,0]];
        return d;
    }

    // --- Equation Formatters for Mode 8 ---
    function formatPointSlope(m, x1, y1) {
        let left = `y`;
        if (y1 !== 0) left += y1 < 0 ? ` + ${Math.abs(y1)}` : ` - ${y1}`;
        let right = "";
        let xPart = `x`;
        if (x1 !== 0) xPart += x1 < 0 ? ` + ${Math.abs(x1)}` : ` - ${x1}`;
        
        if (m === 0) return `${left} = 0`; 
        
        if (m === 1) right = x1 === 0 ? `x` : `(${xPart})`;
        else if (m === -1) right = x1 === 0 ? `-x` : `-(${xPart})`;
        else right = x1 === 0 ? `${m}x` : `${m}(${xPart})`;
        
        return `${left} = ${right}`;
    }

    function formatStandard(m, x1, y1) {
        let A = m;
        let B = -1;
        let C = m * x1 - y1;

        if (A < 0) { A = -A; B = -B; C = -C; }
        if (A === 0) return `y = ${y1}`;

        let aStr = A === 1 ? "x" : `${A}x`;
        let bStr = B === 1 ? " + y" : (B === -1 ? " - y" : (B > 0 ? ` + ${B}y` : ` - ${Math.abs(B)}y`));
        return `${aStr}${bStr} = ${C}`;
    }
    
    function formatSlopeIntercept(m, b) {
        if (m === 0) return `y = ${b}`;
        let mStr = m === 1 ? "x" : (m === -1 ? "-x" : `${m}x`);
        let bStr = b === 0 ? "" : (b > 0 ? ` + ${b}` : ` - ${Math.abs(b)}`);
        return `y = ${mStr}${bStr}`;
    }

    // --- Navigation ---
    function startGame(mode) {
        try {
            document.getElementById('errorAlert').style.display = 'none';
            currentMode = mode;
            currentStreak = 0;
            document.getElementById('streakDisplay').innerText = currentStreak;
            
            document.getElementById('menuScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
            
            let colorVar = mode <= 5 ? "var(--level1)" : "var(--level3)";
            document.getElementById('gameScreen').style.borderColor = colorVar;
            document.getElementById('problemDisplay').style.borderColor = colorVar;

            setTimeout(() => { generateProblem(); }, 50);
        } catch (e) {
            console.error(e);
            alert("App initialization failed. Please refresh the page.");
        }
    }

    function showMenu() {
        document.getElementById('gameScreen').style.display = 'none';
        document.getElementById('menuScreen').style.display = 'block';
        highestStreak = 0; 
        document.getElementById('highStreakDisplay').innerText = highestStreak;
    }

    // --- Bulletproof Generation Engine ---
    function generateProblem() {
        try {
            isTransitioning = false;
            
            let correctAns = "";
            let distractors = new Set();
            let promptHTML = "";
            let promptText = "";
            let infoHTML = "";
            let optionsAreText = false;
            let forceFullWidth = false;

            let problemSignature = "";
            let loopCount = 0;

            do {
                distractors.clear();
                infoHTML = "";
                optionsAreText = false;
                forceFullWidth = false;

                // MODE 1: Power Rule (Advanced Extended)
                if (currentMode === 1) {
                    promptText = "Find the derivative:";
                    
                    let t1 = {cn: getRandomNonZero(-5, 5), cd: 1, pn: getRandomInt(2, 5), pd: 1};
                    let t2 = {cn: getRandomNonZero(-5, 5), cd: 1, pn: getRandomInt(-4, -1), pd: 1};
                    let pd3 = getRandomEl([2, 3, 4]);
                    let pn3 = getRandomEl([1, 3, -1, -3]);
                    if (Math.abs(pn3) === pd3) pn3 = 1; 
                    let t3 = {cn: getRandomNonZero(-3, 3) * pd3, cd: 1, pn: pn3, pd: pd3};
                    
                    let p1 = shuffle([t1, t2, t3]);
                    promptHTML = `\\frac{d}{dx} \\left[ ${formatPolyExt(p1)} \\right]`;
                    
                    let d_correct = polyDerivExt(p1);
                    correctAns = formatPolyExt(d_correct);
                    
                    distractors.add(formatPolyExt(p1.map(t => ({cn: t.cn * t.pn, cd: t.cd * t.pd, pn: t.pn, pd: t.pd})))); // No sub
                    distractors.add(formatPolyExt(p1.map(t => ({cn: t.cn, cd: t.cd, pn: t.pn - t.pd, pd: t.pd})))); // No mult
                    distractors.add(formatPolyExt(p1.map(t => ({cn: t.cn * t.pn, cd: t.cd * t.pd, pn: t.pn + t.pd, pd: t.pd})))); // Add power
                }

                // MODE 2: Product Rule (Mixed Exponents)
                else if (currentMode === 2) {
                    promptText = "Apply the Product Rule (Do not simplify):";
                    forceFullWidth = true;
                    
                    let u = [ 
                        {cn: getRandomNonZero(-4, 4), cd: 1, pn: getRandomEl([2, 3]), pd: 1}, 
                        {cn: getRandomNonZero(-5, 5), cd: 1, pn: 0, pd: 1} 
                    ];
                    let du = polyDerivExt(u);
                    
                    let v = [ 
                        {cn: getRandomNonZero(-4, 4), cd: 1, pn: getRandomEl([1, -1]), pd: getRandomEl([1, 2])}, 
                        {cn: getRandomNonZero(-5, 5), cd: 1, pn: 0, pd: 1} 
                    ];
                    let dv = polyDerivExt(v);

                    promptHTML = `\\frac{d}{dx} \\left[ (${formatPolyExt(u)})(${formatPolyExt(v)}) \\right]`;
                    
                    let u_str = `(${formatPolyExt(u)})`; let du_str = `(${formatPolyExt(du)})`;
                    let v_str = `(${formatPolyExt(v)})`; let dv_str = `(${formatPolyExt(dv)})`;

                    correctAns = `${du_str}${v_str} + ${u_str}${dv_str}`;
                    
                    distractors.add(`${du_str}${v_str} - ${u_str}${dv_str}`); 
                    distractors.add(`${du_str}${dv_str}`); 
                    distractors.add(`${u_str}${v_str} + ${du_str}${dv_str}`); 
                }

                // MODE 3: Quotient Rule (Mixed Exponents)
                else if (currentMode === 3) {
                    promptText = "Apply the Quotient Rule (Do not simplify):";
                    forceFullWidth = true;
                    
                    let u = [ {cn: getRandomNonZero(-4, 4), cd: 1, pn: getRandomInt(2, 3), pd: 1} ];
                    let du = polyDerivExt(u);
                    
                    let v = [ 
                        {cn: getRandomNonZero(1, 4), cd: 1, pn: getRandomEl([1, -1]), pd: getRandomEl([1, 2])}, 
                        {cn: getRandomNonZero(-5, 5), cd: 1, pn: 0, pd: 1} 
                    ];
                    let dv = polyDerivExt(v);

                    promptHTML = `\\frac{d}{dx} \\left[ \\frac{${formatPolyExt(u)}}{${formatPolyExt(v)}} \\right]`;
                    
                    let u_str = `(${formatPolyExt(u)})`; let du_str = `(${formatPolyExt(du)})`;
                    let v_str = `(${formatPolyExt(v)})`; let dv_str = `(${formatPolyExt(dv)})`;
                    let v2_str = `(${formatPolyExt(v)})^2`;

                    correctAns = `\\frac{${du_str}${v_str} - ${u_str}${dv_str}}{${v2_str}}`;
                    
                    distractors.add(`\\frac{${u_str}${dv_str} - ${du_str}${v_str}}{${v2_str}}`); 
                    distractors.add(`\\frac{${du_str}${v_str} + ${u_str}${dv_str}}{${v2_str}}`); 
                    distractors.add(`\\frac{${du_str}}{${dv_str}}`); 
                }

                // MODE 4: Chain Rule (Advanced Power, Sqrt, Cube Root)
                else if (currentMode === 4) {
                    promptText = "Apply the Chain Rule:";
                    forceFullWidth = true;
                    
                    let a = getRandomNonZero(-3, 3);
                    let b = getRandomNonZero(-5, 5);
                    let c = getRandomInt(-5, 5);
                    let u = [ [a, 2], [b, 1], [c, 0] ];
                    let du = polyDeriv(u);
                    
                    let uStr = polyFmt(u);
                    let duStr = `(${polyFmt(du)})`;
                    
                    let type = getRandomInt(1, 3); // 1: Power, 2: Sqrt, 3: Cube Root
                    
                    if (type === 1) { 
                        let n = getRandomEl([-4, -3, -2, 3, 4, 5]);
                        promptHTML = `\\frac{d}{dx} \\left[ (${uStr})^{${n}} \\right]`;
                        correctAns = `${n}(${uStr})^{${n-1}}${duStr}`;
                        
                        distractors.add(`${n}(${uStr})^{${n}}${duStr}`); // Didn't subtract power
                        distractors.add(`(${uStr})^{${n-1}}${duStr}`); // Forgot coef
                        distractors.add(`${n}(${uStr})^{${n-1}}`); // Forgot chain
                        distractors.add(`${n}(${polyFmt(du)})^{${n-1}}`); // Derived inside
                    } else if (type === 2) { 
                        promptHTML = `\\frac{d}{dx} \\left[ \\sqrt{${uStr}} \\right]`;
                        correctAns = `\\frac{${polyFmt(du)}}{2\\sqrt{${uStr}}}`;
                        
                        distractors.add(`\\frac{1}{2\\sqrt{${uStr}}}`); // Forgot chain
                        distractors.add(`\\frac{${polyFmt(du)}}{\\sqrt{${uStr}}}`); // Forgot 2
                        distractors.add(`\\frac{2(${polyFmt(du)})}{\\sqrt{${uStr}}}`); // Multiplied 2
                    } else { 
                        promptHTML = `\\frac{d}{dx} \\left[ \\sqrt[3]{${uStr}} \\right]`;
                        correctAns = `\\frac{${polyFmt(du)}}{3(${uStr})^{2/3}}`;
                        
                        distractors.add(`\\frac{1}{3(${uStr})^{2/3}}`); // Forgot chain
                        distractors.add(`\\frac{${polyFmt(du)}}{3(${uStr})^{-2/3}}`); // Wrong sign denom
                        distractors.add(`\\frac{${polyFmt(du)}}{3\\sqrt[3]{${uStr}}}`); // Kept power 1/3
                    }
                }

                // MODE 5: Implicit Differentiation (Diverse Variables)
                else if (currentMode === 5) {
                    promptText = "Find \\(\\frac{dy}{dx}\\) using implicit differentiation:";
                    
                    let t1 = {c: getRandomNonZero(-4, 4), v: 'x', p: getRandomInt(2, 4)};
                    let t2 = {c: getRandomNonZero(-4, 4), v: 'y', p: getRandomInt(2, 4)};
                    let t3 = null;
                    let type = getRandomInt(1, 3);
                    if (type === 2) t3 = {c: getRandomNonZero(-4, 4), v: 'y', p: 1};
                    if (type === 3) t3 = {c: getRandomNonZero(-4, 4), v: 'x', p: 1};
                    
                    let eqTerms = [t1, t2];
                    if (t3) eqTerms.push(t3);
                    eqTerms = shuffle(eqTerms);
                    
                    function fmtImp(t, isFirst) {
                        if (t.c === 0) return "";
                        let sign = t.c < 0 ? (isFirst ? "-" : " - ") : (isFirst ? "" : " + ");
                        let absC = Math.abs(t.c);
                        let cStr = (absC === 1 && t.p !== 0) ? "" : absC.toString();
                        let pStr = t.p === 0 ? "" : (t.p === 1 ? t.v : `${t.v}^{${t.p}}`);
                        return `${sign}${cStr}${pStr}`;
                    }
                    
                    let lhsStr = fmtImp(eqTerms[0], true);
                    for(let i=1; i<eqTerms.length; i++) lhsStr += fmtImp(eqTerms[i], false);
                    
                    let k = getRandomInt(-10, 10);
                    promptHTML = `${lhsStr} = ${k}`;
                    
                    let topTerms = [];
                    let botTerms = [];
                    for(let t of eqTerms) {
                        if (t.v === 'x') topTerms.push({c: -t.c * t.p, v: 'x', p: t.p - 1});
                        else botTerms.push({c: t.c * t.p, v: 'y', p: t.p - 1});
                    }
                    
                    topTerms.sort((a,b) => b.c - a.c);
                    botTerms.sort((a,b) => b.c - a.c);
                    
                    let topStr = ""; let firstTop = true;
                    for(let t of topTerms) { topStr += fmtImp(t, firstTop); firstTop = false; }
                    if (topStr === "") topStr = "0";
                    
                    let botStr = ""; let firstBot = true;
                    for(let t of botTerms) { botStr += fmtImp(t, firstBot); firstBot = false; }
                    if (botStr === "") botStr = "0";
                    
                    correctAns = `\\frac{${topStr}}{${botStr}}`;
                    
                    distractors.add(`\\frac{${botStr}}{${topStr}}`); // Flipped
                    
                    let wrongTopStr = ""; let wfTop = true;
                    for(let t of topTerms) { wrongTopStr += fmtImp({c: -t.c, v: t.v, p: t.p}, wfTop); wfTop = false; }
                    if (wrongTopStr === "") wrongTopStr = "0";
                    
                    distractors.add(`\\frac{${wrongTopStr}}{${botStr}}`); // Forgot negative
                    distractors.add(`-\\frac{${botStr}}{${wrongTopStr}}`);
                }

                // MODE 6: Multiple Rules (4 Types)
                else if (currentMode === 6) {
                    promptText = "Apply multiple rules (Do not simplify):";
                    forceFullWidth = true;
                    
                    let type = getRandomInt(1, 4);
                    let a = getRandomNonZero(2, 4);
                    let b = getRandomNonZero(-5, 5);
                    let c = getRandomNonZero(1, 4);
                    let d = getRandomNonZero(-3, 3);
                    let n = getRandomInt(3, 5);
                    
                    let u = [ [a, 2], [b, 0] ]; // ax^2+b
                    let v = [ [c, 1], [d, 0] ]; // cx+d
                    let du = polyDeriv(u);
                    let dv = polyDeriv(v);
                    
                    let uStr = `(${polyFmt(u)})`; let duStr = `(${polyFmt(du)})`;
                    let vStr = `(${polyFmt(v)})`; let dvStr = `(${polyFmt(dv)})`;
                    
                    if (type === 1) { // Product + Chain: y = u * v^n
                        promptHTML = `\\frac{d}{dx} \\left[ ${uStr}${vStr}^{${n}} \\right]`;
                        let chain_v = `${n}${vStr}^{${n-1}}${dvStr}`;
                        correctAns = `${duStr}${vStr}^{${n}} + ${uStr}\\left[${chain_v}\\right]`;
                        distractors.add(`${duStr}${vStr}^{${n}} - ${uStr}\\left[${chain_v}\\right]`); 
                        distractors.add(`${duStr}\\left[${chain_v}\\right]`); 
                    } else if (type === 2) { // Quotient + Chain: y = u^n / v
                        promptHTML = `\\frac{d}{dx} \\left[ \\frac{${uStr}^{${n}}}{${vStr}} \\right]`;
                        let chain_u = `${n}${uStr}^{${n-1}}${duStr}`;
                        correctAns = `\\frac{\\left[${chain_u}\\right]${vStr} - ${uStr}^{${n}}${dvStr}}{${vStr}^2}`;
                        distractors.add(`\\frac{\\left[${chain_u}\\right]${vStr} + ${uStr}^{${n}}${dvStr}}{${vStr}^2}`);
                        distractors.add(`\\frac{${uStr}^{${n}}${dvStr} - \\left[${chain_u}\\right]${vStr}}{${vStr}^2}`);
                    } else if (type === 3) { // Chain + Quotient: y = (u/v)^n
                        promptHTML = `\\frac{d}{dx} \\left[ \\left( \\frac{${polyFmt(u)}}{${polyFmt(v)}} \\right)^{${n}} \\right]`;
                        let inner_deriv = `\\frac{${duStr}${vStr} - ${uStr}${dvStr}}{${vStr}^2}`;
                        let outer_deriv = `${n}\\left( \\frac{${polyFmt(u)}}{${polyFmt(v)}} \\right)^{${n-1}}`;
                        correctAns = `${outer_deriv} \\left[ ${inner_deriv} \\right]`;
                        distractors.add(`${outer_deriv} \\left[ \\frac{${uStr}${dvStr} - ${duStr}${vStr}}{${vStr}^2} \\right]`);
                        distractors.add(`${outer_deriv} \\left[ \\frac{${duStr}${vStr} + ${uStr}${dvStr}}{${vStr}^2} \\right]`);
                    } else { // Power + Chain: y = (u)^n
                        promptHTML = `\\frac{d}{dx} \\left[ ${uStr}^{${n}} \\right]`;
                        correctAns = `${n}${uStr}^{${n-1}}${duStr}`;
                        distractors.add(`${n}${uStr}^{${n}}${duStr}`);
                        distractors.add(`${uStr}^{${n-1}}${duStr}`);
                    }
                }

                // MODE 7: Abstract Rules (Advanced 2-Row Table)
                else if (currentMode === 7) {
                    let type = getRandomInt(1, 3); // 1: Prod, 2: Quot, 3: Chain
                    
                    let x1 = getRandomInt(1, 3);
                    let x2; do { x2 = getRandomInt(1, 5); } while(x2 === x1);
                    
                    let f1 = getRandomNonZero(-3, 3); let fp1 = getRandomNonZero(-3, 3);
                    let f2 = getRandomNonZero(-3, 3); let fp2 = getRandomNonZero(-3, 3);
                    
                    let g1 = x2; // Forces g(x1) = x2 for Chain rule
                    let gp1 = getRandomNonZero(-3, 3);
                    let g2 = getRandomNonZero(-3, 3); let gp2 = getRandomNonZero(-3, 3);

                    promptText = "Evaluate the derivative using the table of values:";
                    infoHTML = `
                        <table class="calc-table">
                            <tr><th>\\( x \\)</th><th>\\( f(x) \\)</th><th>\\( f'(x) \\)</th><th>\\( g(x) \\)</th><th>\\( g'(x) \\)</th></tr>
                            <tr><td>${x1}</td><td>${f1}</td><td>${fp1}</td><td>${g1}</td><td>${gp1}</td></tr>
                            <tr><td>${x2}</td><td>${f2}</td><td>${fp2}</td><td>${g2}</td><td>${gp2}</td></tr>
                        </table>
                    `;

                    if (type === 1) { // Product
                        promptHTML = `\\text{If } h(x) = f(x)g(x), \\text{ find } h'(${x1})`;
                        let ans = (fp1 * g1) + (f1 * gp1);
                        correctAns = ans.toString();
                        distractors.add((fp1 * gp1).toString()); 
                        distractors.add(((fp1 * g1) - (f1 * gp1)).toString()); 
                    } else if (type === 2) { // Quotient
                        promptHTML = `\\text{If } h(x) = \\frac{f(x)}{g(x)}, \\text{ find } h'(${x1})`;
                        let top = (fp1 * g1) - (f1 * gp1);
                        let bot = g1 * g1;
                        correctAns = formatFrac(top, bot);
                        distractors.add(formatFrac((fp1*g1) + (f1*gp1), bot)); 
                        distractors.add(formatFrac((f1*gp1) - (fp1*g1), bot)); 
                        distractors.add(formatFrac(fp1, gp1)); 
                    } else { // Chain
                        promptHTML = `\\text{If } h(x) = f(g(x)), \\text{ find } h'(${x1})`;
                        // h'(x1) = f'(g(x1)) * g'(x1) = f'(x2) * gp1
                        let ans = fp2 * gp1;
                        correctAns = ans.toString();
                        
                        distractors.add((fp1 * gp1).toString()); // used f'(x1) instead of f'(g(x1))
                        distractors.add((f2 * gp1).toString()); // used f(g(x1)) instead of f'
                        distractors.add((fp2 + gp1).toString()); // Added instead of mult
                    }
                }

                // MODE 8: Applications (Tangent Lines)
                else if (currentMode === 8) {
                    let isEq = Math.random() > 0.5;
                    let a = getRandomNonZero(-2, 2);
                    let b = getRandomNonZero(-4, 4);
                    let c = getRandomInt(-5, 5);
                    let x_val = getRandomInt(-3, 3);
                    
                    let y_val = a*(x_val*x_val) + b*x_val + c;
                    let m = 2*a*x_val + b;

                    let quadStr = polyFmt([ [a, 2], [b, 1], [c, 0] ]);

                    if (isEq) {
                        promptText = "Find the equation of the tangent line to:";
                        promptHTML = `y = ${quadStr} \\quad \\text{at } x = ${x_val}`;
                        
                        let eqFormat = getRandomInt(0, 3); // 0: y=mx+b, 1: y-y1=m(x-x1), 2: Ax+By=C
                        let b_line = -m * x_val + y_val;
                        
                        let b_bad = -y_val * x_val + y_val; 
                        let b_bad2 = m * x_val + y_val; 
                        let m_bad = 2*a*x_val - b; 
                        let b_bad3 = -m_bad * x_val + y_val; 

                        if (eqFormat === 0) {
                            correctAns = formatSlopeIntercept(m, b_line);
                            distractors.add(formatSlopeIntercept(y_val, b_bad));
                            distractors.add(formatSlopeIntercept(-m, b_bad2));
                            distractors.add(formatSlopeIntercept(m_bad, b_bad3));
                            distractors.add(formatSlopeIntercept(m, y_val)); 
                        } else if (eqFormat === 1) {
                            correctAns = formatPointSlope(m, x_val, y_val);
                            distractors.add(formatPointSlope(m, -x_val, -y_val));
                            distractors.add(formatPointSlope(y_val, x_val, y_val));
                            distractors.add(formatPointSlope(-m, x_val, y_val));
                            distractors.add(formatPointSlope(m, y_val, x_val));
                        } else {
                            correctAns = formatStandard(m, x_val, y_val);
                            distractors.add(formatStandard(-m, x_val, y_val));
                            distractors.add(formatStandard(y_val, x_val, y_val));
                            distractors.add(formatStandard(m, -x_val, -y_val));
                            distractors.add(formatStandard(m_bad, x_val, y_val));
                        }
                    } else {
                        promptText = "Find the slope of the tangent line to:";
                        promptHTML = `y = ${quadStr} \\quad \\text{at } x = ${x_val}`;
                        
                        correctAns = `m = ${m}`;
                        distractors.add(`m = ${y_val}`); 
                        distractors.add(`m = ${-m}`);
                        distractors.add(`m = ${2*a*x_val - b}`); 
                    }
                }

                problemSignature = promptText + promptHTML + correctAns;
                loopCount++;

            } while (problemSignature === lastPrompt && loopCount < 10); 
            
            lastPrompt = problemSignature;

            // --- Safe DOM Updates ---
            document.getElementById('promptTitle').innerText = promptText; 
            
            let displayBox = document.getElementById('problemDisplay');
            if (optionsAreText || promptHTML.includes("\\text{")) {
                displayBox.innerHTML = promptHTML;
            } else {
                displayBox.innerHTML = `\\( ${promptHTML} \\)`;
            }
            
            let infoBox = document.getElementById('infoBox');
            if (infoHTML !== "") {
                infoBox.innerHTML = infoHTML;
                infoBox.style.display = 'flex';
                if (window.renderMathInElement) renderMathInElement(infoBox, { delimiters: [{left: "\\(", right: "\\)", display: false}] });
            } else {
                infoBox.style.display = 'none';
            }

            let finalOptions = new Set();
            finalOptions.add(correctAns);
            let distArray = Array.from(distractors);
            let i = 0;

            while(finalOptions.size < 4 && i < distArray.length) {
                finalOptions.add(distArray[i]); i++;
            }
            
            // Pad safely based on mode formats
            let pad = 1;
            while(finalOptions.size < 4) { 
                if (currentMode === 8 && correctAns.includes("m =")) {
                    finalOptions.add(`m = ${pad++}`);
                } else if (currentMode === 8 && correctAns.includes("y =")) {
                    finalOptions.add(`y = ${pad}x + ${getRandomInt(-3, 3)}`);
                    pad++;
                } else if (currentMode === 7 && correctAns.includes("\\frac")) {
                    finalOptions.add(`\\frac{${pad++}}{2}`);
                } else {
                    let parsed = parseInt(correctAns);
                    if (isNaN(parsed)) parsed = getRandomInt(10, 20);
                    finalOptions.add((parsed + pad).toString()); 
                    pad++;
                }
            }

            let options = shuffle(Array.from(finalOptions));

            const grid = document.getElementById('optionsGrid');
            grid.innerHTML = ''; 

            options.forEach(opt => {
                let btn = document.createElement('button');
                btn.className = 'option-btn';
                if (forceFullWidth || opt.length > 30) btn.classList.add('full-width');
                
                if (optionsAreText) {
                    btn.innerHTML = opt; 
                } else {
                    btn.innerHTML = `\\(${opt}\\)`; 
                }

                btn.onclick = (e) => handleGuess(btn, opt === correctAns, e);
                grid.appendChild(btn);
            });

            if (window.renderMathInElement) {
                renderMathInElement(document.getElementById('gameScreen'), { delimiters: [{left: "\\(", right: "\\)", display: true}] });
            }

        } catch (err) {
            console.error(err);
            document.getElementById('errorAlert').innerText = "Engine Error: " + err.message;
            document.getElementById('errorAlert').style.display = 'block';
        }
    }

    function handleGuess(btn, isCorrect, event) {
        if (isTransitioning || btn.classList.contains('wrong')) return;

        if (isCorrect) {
            isTransitioning = true;
            btn.classList.add('correct');
            playSuccess();
            
            currentStreak++;
            document.getElementById('streakDisplay').innerText = currentStreak;

            if (currentStreak > highestStreak) {
                highestStreak = currentStreak;
                document.getElementById('highStreakDisplay').innerText = highestStreak;
            }

            createSparkle(event.clientX, event.clientY);
            setTimeout(generateProblem, 1000);
        } else {
            btn.classList.add('wrong');
            playWrong();
            currentStreak = 0; 
            document.getElementById('streakDisplay').innerText = currentStreak;
            
            let display = document.getElementById('problemDisplay');
            display.classList.add('error');
            setTimeout(() => display.classList.remove('error'), 400);
        }
    }

    function createSparkle(x, y) {
        const emojis = ['\u2B50', '\uD83C\uDFAF', '\uD83D\uDE80', '\u2728', '\uD83C\uDFC6'];
        const sparkle = document.createElement('div');
        sparkle.innerText = emojis[getRandomInt(0, emojis.length - 1)];
        sparkle.className = 'confetti';
        sparkle.style.left = (x - 15) + 'px';
        sparkle.style.top = (y - 15) + 'px';
        document.body.appendChild(sparkle);
        setTimeout(() => sparkle.remove(), 1000);
    }
</script>
