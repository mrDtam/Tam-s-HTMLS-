<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math 10: Trigonometry</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <style>
        :root {
            --level1: #e67e22; 
            --level2: #3498db;
            --dark: #2c3e50;
            --light: #f8f9fa;
            --secondary: #3498db;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f7;
            color: var(--dark);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 90vh;
            user-select: none;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: var(--dark);
            font-size: 28px;
            margin-top: 0;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 16px;
            margin-bottom: 25px;
            font-weight: bold;
        }

        /* --- Menu Layout --- */
        #menuScreen { display: block; }
        
        .level-section {
            margin-bottom: 25px;
            padding: 20px;
            border-radius: 10px;
            text-align: left;
            background: white;
            border: 2px solid var(--level2);
        }

        .level-title { 
            background: var(--level2); 
            color: white; 
            display: inline-block; 
            padding: 5px 15px; 
            border-radius: 5px; 
            margin-top: -35px; 
            margin-bottom: 15px; 
            font-weight: bold; 
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .menu-btn {
            background-color: var(--light);
            color: var(--dark);
            border: 2px solid #bdc3c7;
            padding: 18px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            display: flex;
            align-items: center;
        }

        .menu-btn span {
            background-color: var(--secondary);
            color: white;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin-right: 15px;
            font-size: 16px;
        }

        .menu-btn:hover {
            background-color: var(--secondary);
            color: white;
            border-color: var(--secondary);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3);
        }

        .menu-btn:hover span {
            background-color: white;
            color: var(--secondary);
        }

        /* --- Game Screen --- */
        #gameScreen { display: none; animation: fadeIn 0.3s ease; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .icon-btn {
            background-color: #ecf0f1;
            color: #7f8c8d;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .icon-btn:hover { background-color: #e0e6ed; }

        .streak-counter {
            font-size: 16px;
            font-weight: bold;
            color: var(--secondary);
            background: #ebf5fb;
            padding: 10px 15px;
            border-radius: 10px;
            border: 2px solid var(--secondary);
        }

        .prompt-text {
            font-size: 22px;
            color: var(--dark);
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* Question Layout container */
        .question-layout {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 25px;
            align-items: center;
        }

        .info-box {
            background-color: #fdfbf7;
            border: 2px dashed var(--level2);
            border-radius: 12px;
            padding: 15px 25px;
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-size: 22px;
            color: var(--dark);
        }

        /* Fixed Canvas Container */
        #trigCanvas {
            background-color: #ffffff;
            border: 2px solid #ecf0f1;
            border-radius: 12px;
            width: 100%;
            max-width: 320px;
            height: auto;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.02);
            display: block;
        }

        .options-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }

        .option-btn {
            flex: 1 1 calc(50% - 15px); 
            max-width: 300px;
            background-color: white;
            color: var(--dark);
            border: 2px solid #bdc3c7;
            padding: 18px 10px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 0 #bdc3c7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 60px;
        }

        .option-btn:hover {
            background-color: #f0f8ff;
            border-color: var(--secondary);
            transform: translateY(2px);
            box-shadow: 0 2px 0 var(--secondary);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: none;
        }

        .option-btn.correct {
            background-color: #e8f8f5 !important;
            border-color: #27ae60 !important;
            color: #27ae60 !important;
            box-shadow: 0 4px 0 #2ecc71 !important;
        }

        .option-btn.wrong {
            background-color: #fadbd8 !important;
            border-color: #c0392b !important;
            color: #c0392b !important;
            box-shadow: 0 2px 0 #e74c3c !important;
            transform: translateY(2px);
            animation: shake 0.4s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }

        .confetti {
            position: absolute;
            font-size: 30px;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            z-index: 100;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.5); }
        }

        @media (min-width: 700px) {
            .question-layout {
                flex-direction: row;
                justify-content: center;
                align-items: stretch;
            }
            .info-box {
                flex: 1;
                margin-bottom: 0;
            }
        }

        @media (max-width: 600px) {
            .option-btn { flex: 1 1 100%; max-width: 100%; } 
            .prompt-text { font-size: 18px; }
            .info-box { font-size: 18px; padding: 15px; }
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- Menu Screen -->
    <div id="menuScreen">
        <h1>Trigonometry</h1>
        <p class="subtitle">CALCULATORS REQUIRED &#128241;</p>
        
        <div class="level-section">
            <div class="level-title">Targeted Skills</div>
            <div class="menu-grid">
                <button class="menu-btn" onclick="startGame(1)"><span>1</span> Identify Sides (Opp, Adj, Hyp)</button>
                <button class="menu-btn" onclick="startGame(2)"><span>2</span> Naming Angles</button>
                <button class="menu-btn" onclick="startGame(3)"><span>3</span> Identify Trig Ratios</button>
                <button class="menu-btn" onclick="startGame(4)"><span>4</span> Solve for Missing Side</button>
                <button class="menu-btn" onclick="startGame(5)"><span>5</span> Solve for Missing Angle</button>
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen">
        <div class="game-header">
            <div>
                <button class="icon-btn" onclick="showMenu()">&#128281; Menu</button>
            </div>
            <div class="streak-counter">&#128293; Streak: <span id="streakDisplay">0</span> | &#127942; Best: <span id="highStreakDisplay">0</span></div>
        </div>

        <div class="prompt-text" id="promptTitle">Question:</div>
        
        <div class="question-layout">
            <div class="info-box" id="infoBox"></div>
            <canvas id="trigCanvas" width="400" height="300"></canvas>
        </div>

        <div class="options-grid" id="optionsGrid"></div>
    </div>

</div>

<script>
    let currentMode = 1;
    let currentStreak = 0;
    let highestStreak = 0; 
    let isTransitioning = false;

    // Math conversions
    const d2r = (deg) => deg * (Math.PI / 180);
    const r2d = (rad) => rad * (180 / Math.PI);
    function round1(num) { return Math.round(num * 10) / 10; }

    // --- Audio System (Safely Decoupled) ---
    let audioCtx;
    function lazyInitAudio() { 
        if (audioCtx) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
            try {
                audioCtx = new AudioContext(); 
                if (audioCtx.state === 'suspended') audioCtx.resume(); 
            } catch(e) {}
        }
    }
    
    function playTone(freq, type, duration, vol) {
        lazyInitAudio();
        if (!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }
    function playSuccess() { playTone(523.25, 'triangle', 0.15, 0.3); setTimeout(() => playTone(659.25, 'triangle', 0.2, 0.3), 100); setTimeout(() => playTone(783.99, 'triangle', 0.4, 0.3), 200); }
    function playWrong() { playTone(200, 'sine', 0.3, 0.3); }

    // --- Utility ---
    function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
    function getRandomEl(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
    function sortSide(s) { return s.split('').sort().join(''); }

    // --- Triangle Canvas Engine (Vector-Based Positioning) ---
    function drawTriangle(labels) {
        const canvas = document.getElementById('trigCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;
        
        const internalW = 400;
        const internalH = 300;
        canvas.width = internalW;
        canvas.height = internalH;
        
        ctx.clearRect(0, 0, internalW, internalH);

        const pad = 45;
        const w = internalW - 2*pad;
        const h = internalH - 2*pad;

        let orientation = getRandomInt(0, 3);
        let ptC, ptA, ptB;

        let ratioW = getRandomInt(70, 100) / 100; 
        let ratioH = getRandomInt(60, 100) / 100;
        let actW = w * ratioW;
        let actH = h * ratioH;
        let offX = pad + (w - actW)/2;
        let offY = pad + (h - actH)/2;

        if (orientation === 0) { // C at BR
            ptC = {x: offX + actW, y: offY + actH};
            ptA = {x: offX, y: offY + actH};
            ptB = {x: offX + actW, y: offY};
        } else if (orientation === 1) { // C at BL
            ptC = {x: offX, y: offY + actH};
            ptA = {x: offX + actW, y: offY + actH};
            ptB = {x: offX, y: offY};
        } else if (orientation === 2) { // C at TL
            ptC = {x: offX, y: offY};
            ptA = {x: offX + actW, y: offY};
            ptB = {x: offX, y: offY + actH};
        } else { // C at TR
            ptC = {x: offX + actW, y: offY};
            ptA = {x: offX, y: offY};
            ptB = {x: offX + actW, y: offY + actH};
        }

        // Triangle Path
        ctx.beginPath();
        ctx.moveTo(ptA.x, ptA.y);
        ctx.lineTo(ptB.x, ptB.y);
        ctx.lineTo(ptC.x, ptC.y);
        ctx.closePath();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#2c3e50';
        ctx.stroke();
        ctx.fillStyle = 'rgba(52, 152, 219, 0.05)';
        ctx.fill();

        // Right Angle Marker
        const sqSize = 15;
        let sqSignX = (ptC.x > ptA.x || ptC.x > ptB.x) ? -1 : 1;
        let sqSignY = (ptC.y > ptA.y || ptC.y > ptB.y) ? -1 : 1;
        ctx.beginPath();
        ctx.moveTo(ptC.x + sqSignX*sqSize, ptC.y);
        ctx.lineTo(ptC.x + sqSignX*sqSize, ptC.y + sqSignY*sqSize);
        ctx.lineTo(ptC.x, ptC.y + sqSignY*sqSize);
        ctx.strokeStyle = '#e74c3c';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Vector Utility for Positioning
        const getNorm = (p1, p2) => {
            let dx = p2.x - p1.x; let dy = p2.y - p1.y;
            let len = Math.sqrt(dx*dx + dy*dy) || 1;
            return {x: dx/len, y: dy/len};
        };

        // Midpoints
        let midA = {x: (ptB.x+ptC.x)/2, y: (ptB.y+ptC.y)/2}; // Side opposite A
        let midB = {x: (ptA.x+ptC.x)/2, y: (ptA.y+ptC.y)/2}; // Side opposite B
        let midC = {x: (ptA.x+ptB.x)/2, y: (ptA.y+ptB.y)/2}; // Hypotenuse

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // Draw Vertices (Pushed outward from the midpoints)
        const vDist = 24;
        ctx.fillStyle = '#2c3e50';
        ctx.font = 'bold 20px -apple-system, sans-serif';
        
        let nVA = getNorm(midA, ptA);
        ctx.fillText(labels.vertA || "A", ptA.x + nVA.x*vDist, ptA.y + nVA.y*vDist);
        
        let nVB = getNorm(midB, ptB);
        ctx.fillText(labels.vertB || "B", ptB.x + nVB.x*vDist, ptB.y + nVB.y*vDist);
        
        let nVC = getNorm(midC, ptC);
        ctx.fillText(labels.vertC || "C", ptC.x + nVC.x*(vDist-5), ptC.y + nVC.y*(vDist-5));

        // Draw Side Values (Pushed outward from the opposite vertex)
        const sDist = 22;
        ctx.font = 'bold 22px -apple-system, sans-serif';
        ctx.fillStyle = '#3498db'; 
        
        if(labels.a) {
            let nA = getNorm(ptA, midA);
            ctx.fillText(labels.a, midA.x + nA.x*sDist, midA.y + nA.y*sDist);
        }
        if(labels.b) {
            let nB = getNorm(ptB, midB);
            ctx.fillText(labels.b, midB.x + nB.x*sDist, midB.y + nB.y*sDist);
        }
        if(labels.c) {
            let nC = getNorm(ptC, midC);
            ctx.fillText(labels.c, midC.x + nC.x*sDist, midC.y + nC.y*sDist);
        }

        // Draw Angles (Pushed inward from the vertex toward the opposite midpoint)
        const aDist = 35;
        ctx.fillStyle = '#e67e22'; 
        ctx.font = 'bold 20px -apple-system, sans-serif';
        
        if (labels.angleA) {
            let nA = getNorm(ptA, midA);
            ctx.fillText(labels.angleA, ptA.x + nA.x*aDist, ptA.y + nA.y*aDist);
        }
        
        if (labels.angleB) {
            let nB = getNorm(ptB, midB);
            ctx.fillText(labels.angleB, ptB.x + nB.x*aDist, ptB.y + nB.y*aDist);
        }
    }

    // --- Navigation ---
    function startGame(mode) {
        try {
            currentMode = mode;
            currentStreak = 0;
            document.getElementById('streakDisplay').innerText = currentStreak;
            
            document.getElementById('menuScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
            
            setTimeout(() => { generateProblem(); }, 50);
        } catch (e) { console.error(e); }
    }

    function showMenu() {
        document.getElementById('gameScreen').style.display = 'none';
        document.getElementById('menuScreen').style.display = 'block';
        highestStreak = 0; 
        document.getElementById('highStreakDisplay').innerText = highestStreak;
    }

    // --- Problem Generation Engine ---
    function generateProblem() {
        isTransitioning = false;
        
        let correctAns = "";
        let distractors = new Set();
        let infoLines = [];
        
        const letterSets = [ ['A','B','C'], ['P','Q','R'], ['X','Y','Z'] ];
        let letters = getRandomEl(letterSets);
        let rightAngle = getRandomEl(letters);
        let acuteAngles = letters.filter(l => l !== rightAngle);
        
        let vertC = rightAngle;
        let vertA = acuteAngles[0];
        let vertB = acuteAngles[1];

        let hypSide = sortSide(vertA + vertB);
        
        const getOppSide = (ang) => sortSide(letters.filter(l => l !== ang).join(''));
        const getAdjSide = (ang) => sortSide(ang + vertC);

        let labels = { vertA: vertA, vertB: vertB, vertC: vertC, a: '', b: '', c: '', angleA: '', angleB: '' };

        infoLines.push(`\\text{In } \\triangle ${letters.join('')}, \\quad \\angle ${rightAngle} = 90^\\circ`);

        // Set target options length
        let targetOptionsSize = currentMode === 1 ? 3 : 4; 

        if (currentMode === 1) { // Identify Sides (3 Options strictly)
            document.getElementById('promptTitle').innerText = "Identify the side:";
            
            let targetAngle = getRandomEl(acuteAngles);
            let targetType = getRandomEl(['Hypotenuse', 'Opposite', 'Adjacent']);
            
            infoLines.push(`\\text{With respect to reference } \\angle ${targetAngle}:`);
            
            labels[targetAngle === vertA ? 'angleA' : 'angleB'] = '\u03B8'; // Unicode Theta

            if (targetType === 'Hypotenuse') {
                infoLines.push(`\\text{Which side is the \\textbf{Hypotenuse}?}`);
                correctAns = hypSide;
            } else if (targetType === 'Opposite') {
                infoLines.push(`\\text{Which side is \\textbf{Opposite} to } \\angle ${targetAngle}?`);
                correctAns = getOppSide(targetAngle);
            } else {
                infoLines.push(`\\text{Which side is \\textbf{Adjacent} to } \\angle ${targetAngle}?`);
                correctAns = getAdjSide(targetAngle);
            }

            // Exactly 3 distractors guarantees no NaN padding needed
            distractors.add(hypSide);
            distractors.add(getOppSide(targetAngle));
            distractors.add(getAdjSide(targetAngle));
        }

        else if (currentMode === 2) { // Naming Angles
            document.getElementById('promptTitle').innerText = "Identify the angle:";
            
            let qType = getRandomInt(1, 2);
            let targetAng = getRandomEl(acuteAngles);
            
            labels[targetAng === vertA ? 'angleA' : 'angleB'] = '\u03B8';

            if (qType === 1) {
                let oppSide = getOppSide(targetAng);
                infoLines.push(`\\text{Which angle is \\textbf{opposite} to side } ${oppSide}?`);
            } else {
                let adjSide = getAdjSide(targetAng);
                infoLines.push(`\\text{Which angle is formed by } ${hypSide} \\text{ and } ${adjSide}?`);
            }
            
            let otherAng = acuteAngles.find(a => a !== targetAng);
            correctAns = `\\angle ${otherAng}${targetAng}${rightAngle}`;
            
            distractors.add(`\\angle ${targetAng}${otherAng}${rightAngle}`);
            distractors.add(`\\angle ${targetAng}${rightAngle}${otherAng}`);
            distractors.add(`\\angle ${rightAngle}${otherAng}${targetAng}`);
        }

        else if (currentMode === 3) { // Trig Ratios
            document.getElementById('promptTitle').innerText = "Determine the exact ratio:";
            
            let trips = [ [3,4,5], [5,12,13], [8,15,17], [7,24,25] ];
            let trip = getRandomEl(trips);
            
            let leg1 = trip[0]; let leg2 = trip[1];
            if (Math.random() > 0.5) { leg1 = trip[1]; leg2 = trip[0]; }
            
            let targetAngle = getRandomEl(acuteAngles);
            let opp = getOppSide(targetAngle);
            let adj = getAdjSide(targetAngle);
            
            infoLines.push(`${opp} = ${leg1}, \\quad ${adj} = ${leg2}, \\quad ${hypSide} = ${trip[2]}`);
            
            let trigFunc = getRandomEl(['\\sin', '\\cos', '\\tan']);
            infoLines.push(`\\text{Evaluate } \\mathbf{${trigFunc}(${targetAngle})}`);
            
            labels[targetAngle === vertA ? 'angleA' : 'angleB'] = '\u03B8';
            if (targetAngle === vertA) { labels.a = leg1; labels.b = leg2; }
            else { labels.b = leg1; labels.a = leg2; }
            labels.c = trip[2];

            if (trigFunc === '\\sin') correctAns = `\\frac{${leg1}}{${trip[2]}}`;
            else if (trigFunc === '\\cos') correctAns = `\\frac{${leg2}}{${trip[2]}}`;
            else correctAns = `\\frac{${leg1}}{${leg2}}`;

            distractors.add(`\\frac{${leg1}}{${trip[2]}}`);
            distractors.add(`\\frac{${leg2}}{${trip[2]}}`);
            distractors.add(`\\frac{${leg1}}{${leg2}}`);
            distractors.add(`\\frac{${leg2}}{${leg1}}`);
        }

        else if (currentMode === 4) { // Solve Side
            document.getElementById('promptTitle').innerText = "Solve (to 1 decimal place):";
            
            let targetAngle = getRandomEl(acuteAngles);
            let deg = getRandomInt(20, 70);
            
            let opp = getOppSide(targetAngle);
            let adj = getAdjSide(targetAngle);
            let hyp = hypSide;
            
            let givenLen = getRandomInt(10, 30);
            let trigScenario = getRandomInt(1, 6);
            let ans;

            infoLines.push(`\\angle ${targetAngle} = ${deg}^\\circ`);
            labels[targetAngle === vertA ? 'angleA' : 'angleB'] = `${deg}\u00B0`; // Unicode degree

            if (trigScenario === 1) { // Given Hyp, Find Opp 
                infoLines.push(`${hyp} = ${givenLen}`);
                infoLines.push(`\\text{Find } ${opp}`);
                
                labels.c = givenLen.toString();
                if (targetAngle === vertA) labels.a = "x"; else labels.b = "x";

                ans = givenLen * Math.sin(d2r(deg));
                distractors.add(round1(givenLen / Math.sin(d2r(deg))).toString());
                distractors.add(round1(givenLen * Math.cos(d2r(deg))).toString());
            } else if (trigScenario === 2) { // Given Opp, Find Hyp 
                infoLines.push(`${opp} = ${givenLen}`);
                infoLines.push(`\\text{Find } ${hyp}`);
                
                labels.c = "x";
                if (targetAngle === vertA) labels.a = givenLen.toString(); else labels.b = givenLen.toString();

                ans = givenLen / Math.sin(d2r(deg));
                distractors.add(round1(givenLen * Math.sin(d2r(deg))).toString());
                distractors.add(round1(givenLen / Math.cos(d2r(deg))).toString());
            } else if (trigScenario === 3) { // Given Hyp, Find Adj
                infoLines.push(`${hyp} = ${givenLen}`);
                infoLines.push(`\\text{Find } ${adj}`);

                labels.c = givenLen.toString();
                if (targetAngle === vertA) labels.b = "x"; else labels.a = "x";

                ans = givenLen * Math.cos(d2r(deg));
                distractors.add(round1(givenLen / Math.cos(d2r(deg))).toString());
                distractors.add(round1(givenLen * Math.sin(d2r(deg))).toString());
            } else if (trigScenario === 4) { // Given Adj, Find Hyp 
                infoLines.push(`${adj} = ${givenLen}`);
                infoLines.push(`\\text{Find } ${hyp}`);

                labels.c = "x";
                if (targetAngle === vertA) labels.b = givenLen.toString(); else labels.a = givenLen.toString();

                ans = givenLen / Math.cos(d2r(deg));
                distractors.add(round1(givenLen * Math.cos(d2r(deg))).toString());
                distractors.add(round1(givenLen / Math.sin(d2r(deg))).toString());
            } else if (trigScenario === 5) { // Given Adj, Find Opp 
                infoLines.push(`${adj} = ${givenLen}`);
                infoLines.push(`\\text{Find } ${opp}`);

                if (targetAngle === vertA) { labels.b = givenLen.toString(); labels.a = "x"; }
                else { labels.a = givenLen.toString(); labels.b = "x"; }

                ans = givenLen * Math.tan(d2r(deg));
                distractors.add(round1(givenLen / Math.tan(d2r(deg))).toString());
                distractors.add(round1(givenLen * Math.sin(d2r(deg))).toString());
            } else { // Given Opp, Find Adj 
                infoLines.push(`${opp} = ${givenLen}`);
                infoLines.push(`\\text{Find } ${adj}`);

                if (targetAngle === vertA) { labels.a = givenLen.toString(); labels.b = "x"; }
                else { labels.b = givenLen.toString(); labels.a = "x"; }

                ans = givenLen / Math.tan(d2r(deg));
                distractors.add(round1(givenLen * Math.tan(d2r(deg))).toString());
                distractors.add(round1(givenLen / Math.sin(d2r(deg))).toString());
            }

            correctAns = round1(ans).toString();
        }

        else if (currentMode === 5) { // Solve Angle
            document.getElementById('promptTitle').innerText = "Solve (to 1 decimal place):";
            
            let targetAngle = getRandomEl(acuteAngles);
            
            let opp = getOppSide(targetAngle);
            let adj = getAdjSide(targetAngle);
            let hyp = hypSide;

            let s1 = getRandomInt(5, 15);
            let s2 = getRandomInt(16, 25);
            
            let trigScenario = getRandomInt(1, 3);
            let ans;

            labels[targetAngle === vertA ? 'angleA' : 'angleB'] = '\u03B8';

            if (trigScenario === 1) { // Sin
                infoLines.push(`${opp} = ${s1}, \\quad ${hyp} = ${s2}`);
                labels.c = s2.toString();
                if (targetAngle === vertA) labels.a = s1.toString(); else labels.b = s1.toString();

                ans = r2d(Math.asin(s1/s2));
                distractors.add(round1(r2d(Math.acos(s1/s2))).toString() + "^\\circ"); 
            } else if (trigScenario === 2) { // Cos
                infoLines.push(`${adj} = ${s1}, \\quad ${hyp} = ${s2}`);
                labels.c = s2.toString();
                if (targetAngle === vertA) labels.b = s1.toString(); else labels.a = s1.toString();

                ans = r2d(Math.acos(s1/s2));
                distractors.add(round1(r2d(Math.asin(s1/s2))).toString() + "^\\circ"); 
            } else { // Tan 
                if (Math.random() > 0.5) { let temp = s1; s1 = s2; s2 = temp; }
                infoLines.push(`${opp} = ${s1}, \\quad ${adj} = ${s2}`);

                if (targetAngle === vertA) { labels.a = s1.toString(); labels.b = s2.toString(); }
                else { labels.b = s1.toString(); labels.a = s2.toString(); }

                ans = r2d(Math.atan(s1/s2));
                distractors.add(round1(r2d(Math.atan(s2/s1))).toString() + "^\\circ"); 
            }

            infoLines.push(`\\text{Find } \\angle ${targetAngle}`);
            correctAns = round1(ans).toString() + "^\\circ";
            distractors.add(round1(ans + getRandomInt(5, 10)).toString() + "^\\circ"); 
        }

        drawTriangle(labels);

        let boxHtml = infoLines.map(line => `<p style="margin:5px 0;">\\(${line}\\)</p>`).join('');
        document.getElementById('infoBox').innerHTML = boxHtml;

        // Fill options safely based on dynamic size (3 for mode 1, 4 for others)
        let finalOptions = new Set();
        finalOptions.add(correctAns);
        let distArray = Array.from(distractors);
        let i = 0;
        
        while(finalOptions.size < targetOptionsSize && i < distArray.length) {
            finalOptions.add(distArray[i]); i++;
        }
        
        let pad = 1;
        while(finalOptions.size < targetOptionsSize) { 
            if (currentMode === 5) finalOptions.add(`${pad++}^\\circ`);
            else if (currentMode === 2) finalOptions.add(`\\angle ${rightAngle}${pad++}${vertA}`);
            else finalOptions.add((parseFloat(correctAns || "10") + pad++).toString()); 
        }

        let options = shuffle(Array.from(finalOptions));

        const grid = document.getElementById('optionsGrid');
        grid.innerHTML = ''; 

        options.forEach(opt => {
            let btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = `\\(${opt}\\)`;
            btn.onclick = (e) => handleGuess(btn, opt === correctAns, e);
            grid.appendChild(btn);
        });

        if (window.renderMathInElement) {
            renderMathInElement(document.getElementById('gameScreen'), { delimiters: [{left: "\\(", right: "\\)", display: true}] });
        }
    }

    function handleGuess(btn, isCorrect, event) {
        if (isTransitioning || btn.classList.contains('wrong')) return;

        if (isCorrect) {
            isTransitioning = true;
            btn.classList.add('correct');
            playSuccess();
            
            currentStreak++;
            document.getElementById('streakDisplay').innerText = currentStreak;

            if (currentStreak > highestStreak) {
                highestStreak = currentStreak;
                document.getElementById('highStreakDisplay').innerText = highestStreak;
            }

            createSparkle(event.clientX, event.clientY);
            setTimeout(generateProblem, 1000);
        } else {
            btn.classList.add('wrong');
            playWrong();
            currentStreak = 0; 
            document.getElementById('streakDisplay').innerText = currentStreak;
        }
    }

    function createSparkle(x, y) {
        const emojis = ['\u2B50', '\uD83C\uDFAF', '\uD83D\uDE80', '\u2728', '\uD83C\uDFC6'];
        const sparkle = document.createElement('div');
        sparkle.innerText = emojis[getRandomInt(0, emojis.length - 1)];
        sparkle.className = 'confetti';
        sparkle.style.left = (x - 15) + 'px';
        sparkle.style.top = (y - 15) + 'px';
        document.body.appendChild(sparkle);
        setTimeout(() => sparkle.remove(), 1000);
    }
</script>
