<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Calculus 12: Transformations</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <style>
        :root {
            --level1: #e67e22; 
            --level2: #3498db;
            --level3: #9b59b6;
            --dark: #2c3e50;
            --light: #f8f9fa;
            --secondary: #3498db;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f7;
            color: var(--dark);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 90vh;
            user-select: none;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            max-width: 850px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: var(--dark);
            font-size: 26px;
            margin-top: 0;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 15px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        /* --- Menu Layout --- */
        #menuScreen { display: block; }
        
        .level-section {
            margin-bottom: 25px;
            padding: 20px;
            border-radius: 10px;
            text-align: left;
            background: white;
            border: 2px solid var(--level1);
        }
        
        .level-section.lvl-3 { border-color: var(--level3); }

        .level-title { 
            background: var(--level1); 
            color: white; 
            display: inline-block; 
            padding: 5px 15px; 
            border-radius: 5px; 
            margin-top: -35px; 
            margin-bottom: 15px; 
            font-weight: bold; 
        }
        
        .lvl-3 .level-title { background: var(--level3); }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .menu-btn {
            background-color: var(--light);
            color: var(--dark);
            border: 2px solid #bdc3c7;
            padding: 12px 18px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            display: flex;
            align-items: center;
        }

        .menu-btn span {
            background-color: var(--secondary);
            color: white;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin-right: 12px;
            font-size: 13px;
            flex-shrink: 0;
        }
        
        .lvl-3 .menu-btn span { background-color: var(--level3); }

        .menu-btn:hover {
            background-color: var(--secondary);
            color: white;
            border-color: var(--secondary);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3);
        }
        
        .lvl-3 .menu-btn:hover { background-color: var(--level3); border-color: var(--level3); }

        /* --- Game Screen --- */
        #gameScreen { display: none; animation: fadeIn 0.3s ease; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .icon-btn {
            background-color: #ecf0f1;
            color: #7f8c8d;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .icon-btn:hover { background-color: #e0e6ed; }

        .streak-counter {
            font-size: 15px;
            font-weight: bold;
            color: var(--secondary);
            background: #ebf5fb;
            padding: 8px 15px;
            border-radius: 10px;
            border: 2px solid var(--secondary);
        }

        .prompt-text {
            font-size: 18px;
            color: var(--dark);
            font-weight: bold;
            margin-bottom: 10px;
        }

        .problem-display {
            font-size: 26px; 
            margin: 0 auto 20px auto;
            padding: 15px 25px;
            background-color: #fdfbf7;
            border-radius: 12px;
            border: 2px solid var(--level1);
            color: var(--dark);
            min-height: 80px;
            display: block; 
            text-align: center;
            transition: all 0.3s;
            line-height: 1.6;
            max-width: 650px;
            word-wrap: break-word;
        }
        
        .problem-display.error {
            background-color: #fadbd8;
            border-color: #e74c3c;
            animation: shake 0.4s;
        }

        #errorAlert {
            display: none;
            color: #c0392b;
            font-weight: bold;
            margin-bottom: 15px;
            padding: 10px;
            background: #fadbd8;
            border-radius: 8px;
        }

        .options-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
        }

        .option-btn {
            flex: 1 1 calc(50% - 12px); 
            background-color: white;
            color: var(--dark);
            border: 2px solid #bdc3c7;
            padding: 15px 10px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 0 #bdc3c7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 55px;
            text-align: center;
            line-height: 1.3;
        }
        
        .option-btn.full-width {
            flex: 1 1 100%;
        }

        .option-btn:hover {
            background-color: #f0f8ff;
            border-color: var(--secondary);
            transform: translateY(2px);
            box-shadow: 0 2px 0 var(--secondary);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: none;
        }

        .option-btn.correct {
            background-color: #e8f8f5 !important;
            border-color: #27ae60 !important;
            color: #27ae60 !important;
            box-shadow: 0 4px 0 #2ecc71 !important;
        }

        .option-btn.wrong {
            background-color: #fadbd8 !important;
            border-color: #c0392b !important;
            color: #c0392b !important;
            box-shadow: 0 2px 0 #e74c3c !important;
            transform: translateY(2px);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }

        .confetti {
            position: absolute;
            font-size: 30px;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            z-index: 100;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.5); }
        }

        @media (max-width: 600px) {
            .menu-grid { grid-template-columns: 1fr; }
            .option-btn { flex: 1 1 100%; font-size: 18px; padding: 12px 5px;} 
            .problem-display { font-size: 22px; padding: 15px 10px; } 
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- Menu Screen -->
    <div id="menuScreen">
        <h1>Functions & Transformations</h1>
        <p class="subtitle">Pre-Calculus 12 Skills</p>
        
        <div class="level-section">
            <div class="level-title">Level 1 to Level 2</div>
            <div class="menu-grid">
                <button class="menu-btn" onclick="startGame(1)"><span>1</span> Relations vs. 1-to-1 Functions</button>
                <button class="menu-btn" onclick="startGame(2)"><span>2</span> Describe Basic Transformations</button>
                <button class="menu-btn" onclick="startGame(3)"><span>3</span> Transform a Point (Basic)</button>
                <button class="menu-btn" onclick="startGame(4)"><span>4</span> Inverse Points & Domains</button>
            </div>
        </div>

        <div class="level-section lvl-3">
            <div class="level-title">Level 3 to Level 4</div>
            <div class="menu-grid">
                <button class="menu-btn" onclick="startGame(5)"><span>5</span> Evaluate Composites: f(g(x))</button>
                <button class="menu-btn" onclick="startGame(6)"><span>6</span> Build & Break Composites</button>
                <button class="menu-btn" onclick="startGame(7)"><span>7</span> Advanced Transformations (Factoring)</button>
                <button class="menu-btn" onclick="startGame(8)"><span>8</span> Inverse Equations & Evaluation</button>
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen">
        <div class="game-header">
            <div>
                <button class="icon-btn" onclick="showMenu()">&#128281; Menu</button>
            </div>
            <div class="streak-counter">&#128293; Streak: <span id="streakDisplay">0</span> | &#127942; Best: <span id="highStreakDisplay">0</span></div>
        </div>

        <div id="errorAlert"></div>

        <div class="prompt-text" id="promptTitle">Question:</div>
        
        <div class="problem-display" id="problemDisplay"></div>

        <div class="options-grid" id="optionsGrid"></div>
    </div>

</div>

<script>
    let currentMode = 1;
    let currentStreak = 0;
    let highestStreak = 0; 
    let isTransitioning = false;
    let lastPrompt = "";

    // --- Audio System ---
    let audioCtx;
    function lazyInitAudio() { 
        if (audioCtx) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
            try {
                audioCtx = new AudioContext(); 
                if (audioCtx.state === 'suspended') audioCtx.resume(); 
            } catch(e) {}
        }
    }
    function playTone(freq, type, duration, vol) {
        lazyInitAudio();
        if (!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }
    function playSuccess() { playTone(523.25, 'triangle', 0.15, 0.3); setTimeout(() => playTone(659.25, 'triangle', 0.2, 0.3), 100); setTimeout(() => playTone(783.99, 'triangle', 0.4, 0.3), 200); }
    function playWrong() { playTone(200, 'sine', 0.3, 0.3); }

    // --- Math Utility ---
    function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
    function getRandomEl(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function getRandomNonZero(min, max) {
        let val; do { val = Math.floor(Math.random() * (max - min + 1)) + min; } while (val === 0); return val;
    }
    function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
    
    // Abstract Transformation Formatter: y = a f(b(x-c)) + d
    function formatTransformedFunc(a, b, c, d, requiresFactoring = false) {
        let str = "y = ";
        if (a === -1) str += "-";
        else if (a !== 1 && a !== 0) str += a;
        
        str += "f(";
        
        let inner = "";
        if (requiresFactoring) {
            let bx = "";
            if (b === -1) bx = "-x";
            else if (b === 1) bx = "x";
            else bx = b + "x";
            
            let cDist = -b * c; 
            if (cDist === 0) inner = bx;
            else if (cDist > 0) inner = bx + " + " + cDist;
            else inner = bx + " - " + Math.abs(cDist);
        } else {
            let bStr = "";
            if (b === -1) bStr = "-";
            else if (b !== 1 && b !== 0) bStr = b;
            
            let cStr = "";
            if (c > 0) cStr = "(x - " + c + ")";
            else if (c < 0) cStr = "(x + " + Math.abs(c) + ")";
            else cStr = "x";
            
            inner = bStr + cStr;
        }
        
        str += inner + ")";
        
        if (d > 0) str += " + " + d;
        else if (d < 0) str += " - " + Math.abs(d);
        
        return str;
    }

    // --- Navigation ---
    function startGame(mode) {
        try {
            document.getElementById('errorAlert').style.display = 'none';
            currentMode = mode;
            currentStreak = 0;
            document.getElementById('streakDisplay').innerText = currentStreak;
            
            document.getElementById('menuScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
            
            let colorVar = mode <= 4 ? "var(--level1)" : "var(--level3)";
            document.getElementById('gameScreen').style.borderColor = colorVar;
            document.getElementById('problemDisplay').style.borderColor = colorVar;

            setTimeout(() => { generateProblem(); }, 50);
        } catch (e) {
            console.error(e);
            alert("App initialization failed. Please refresh the page.");
        }
    }

    function showMenu() {
        document.getElementById('gameScreen').style.display = 'none';
        document.getElementById('menuScreen').style.display = 'block';
        highestStreak = 0; 
        document.getElementById('highStreakDisplay').innerText = highestStreak;
    }

    // --- Bulletproof Generation Engine ---
    function generateProblem() {
        try {
            isTransitioning = false;
            
            let correctAns = "";
            let distractors = new Set();
            let promptHTML = "";
            let promptText = "";
            let optionsAreText = false; 
            let forceFullWidth = false; 

            let problemSignature = "";
            let loopCount = 0;

            do {
                distractors.clear();
                optionsAreText = false;
                forceFullWidth = false;

                // MODE 1: Relations vs 1-to-1 Functions (Fixed Answers)
                if (currentMode === 1) {
                    promptText = "Classify the relation:";
                    optionsAreText = true;
                    forceFullWidth = true;
                    
                    let subType = getRandomInt(1, 4);
                    
                    if (subType === 1) {
                        promptHTML = "A graph passes the Vertical Line Test but fails the Horizontal Line Test.";
                        correctAns = "It is a function, but NOT one-to-one.";
                    } else if (subType === 2) {
                        promptHTML = "A graph fails the Vertical Line Test.";
                        correctAns = "It is a relation, but NOT a function.";
                    } else if (subType === 3) {
                        promptHTML = "A graph passes both the Vertical and Horizontal Line Tests.";
                        correctAns = "It is a one-to-one function.";
                    } else {
                        let isFunc = Math.random() > 0.5;
                        let isOneToOne = isFunc && Math.random() > 0.5;
                        
                        let pts = "";
                        if (isOneToOne) {
                            pts = "\\{ (1, 2), (2, 4), (3, 6) \\}";
                            correctAns = "It is a one-to-one function.";
                        } else if (isFunc) {
                            pts = "\\{ (1, 4), (2, 4), (3, 6) \\}"; 
                            correctAns = "It is a function, but NOT one-to-one.";
                        } else {
                            pts = "\\{ (1, 2), (1, 4), (3, 6) \\}"; 
                            correctAns = "It is a relation, but NOT a function.";
                        }
                        promptHTML = `Given the set of points: \\( ${pts} \\)`;
                    }
                }

                // MODE 2: Describe Basic Transformations
                else if (currentMode === 2) {
                    promptText = "Describe the transformations applied to \\(f(x) \\):";
                    optionsAreText = true;
                    forceFullWidth = true;
                    
                    let a=1, b=1, c=0, d=0;
                    let type1 = getRandomInt(1, 4);
                    let type2; do { type2 = getRandomInt(1, 4); } while (type1 === type2);
                    
                    let descParts = [];
                    let trapParts1 = []; 
                    let trapParts2 = []; 
                    
                    function applyTrans(type, isReal) {
                        if (type === 1) { 
                            let val = getRandomEl([-1, 2, 3]);
                            if (isReal) a = val;
                            if (val === -1) {
                                if (isReal) descParts.push("Vertical reflection");
                                else { trapParts1.push("Horizontal reflection"); trapParts2.push("Vertical stretch"); }
                            } else {
                                if (isReal) descParts.push(`Vertical stretch by ${val}`);
                                else { trapParts1.push(`Horizontal stretch by ${val}`); trapParts2.push(`Vertical stretch by 1/${val}`); }
                            }
                        } else if (type === 2) { 
                            let val = getRandomEl([-1, 2, 3]);
                            if (isReal) b = val;
                            if (val === -1) {
                                if (isReal) descParts.push("Horizontal reflection");
                                else { trapParts1.push("Vertical reflection"); trapParts2.push("Horizontal stretch"); }
                            } else {
                                if (isReal) descParts.push(`Horizontal compression by 1/${val}`);
                                else { trapParts1.push(`Vertical compression by 1/${val}`); trapParts2.push(`Horizontal stretch by ${val}`); }
                            }
                        } else if (type === 3) { 
                            let val = getRandomNonZero(-5, 5);
                            if (isReal) c = val;
                            if (isReal) descParts.push(val > 0 ? `Right ${val}` : `Left ${Math.abs(val)}`);
                            else { 
                                trapParts1.push(val > 0 ? `Up ${val}` : `Down ${Math.abs(val)}`); 
                                trapParts2.push(val > 0 ? `Left ${val}` : `Right ${Math.abs(val)}`); 
                            }
                        } else { 
                            let val = getRandomNonZero(-5, 5);
                            if (isReal) d = val;
                            if (isReal) descParts.push(val > 0 ? `Up ${val}` : `Down ${Math.abs(val)}`);
                            else { 
                                trapParts1.push(val > 0 ? `Right ${val}` : `Left ${Math.abs(val)}`); 
                                trapParts2.push(val > 0 ? `Down ${val}` : `Up ${Math.abs(val)}`); 
                            }
                        }
                    }
                    
                    applyTrans(type1, true); applyTrans(type2, true);
                    applyTrans(type1, false); applyTrans(type2, false); 
                    
                    promptHTML = `Describe the transformation from \\( y=f(x) \\) to \\( ${formatTransformedFunc(a, b, c, d)} \\)`;
                    
                    correctAns = descParts.join(" and ");
                    distractors.add(trapParts1.join(" and "));
                    distractors.add(trapParts2.join(" and "));
                    distractors.add(`${descParts[0]} and ${trapParts2[1]}`); 
                    
                    if (distractors.size < 3) distractors.add("No transformations applied");
                }

                // MODE 3: Transform a Point
                else if (currentMode === 3) {
                    promptText = "Find the new coordinates of the point:";
                    optionsAreText = false; 
                    
                    let px = getRandomNonZero(-6, 6);
                    let py = getRandomNonZero(-6, 6);
                    
                    let a=1, b=1, c=0, d=0;
                    let type1 = getRandomInt(1, 4);
                    let type2; do { type2 = getRandomInt(1, 4); } while (type1 === type2);
                    
                    if (type1===1||type2===1) a = getRandomEl([-1, -2, 2, 3]);
                    if (type1===2||type2===2) {
                        b = getRandomEl([-1, 2]); 
                        px = b * getRandomNonZero(-3, 3); 
                    }
                    if (type1===3||type2===3) c = getRandomNonZero(-5, 5);
                    if (type1===4||type2===4) d = getRandomNonZero(-5, 5);

                    promptHTML = `If \\( (${px}, ${py}) \\) is on \\( y = f(x) \\), what point is on \\( ${formatTransformedFunc(a, b, c, d)} \\)?`;
                    
                    let newX = (px / b) + c;
                    let newY = (a * py) + d;
                    
                    correctAns = `(${newX}, ${newY})`;
                    
                    distractors.add(`(${(px / b) - c}, ${newY})`); 
                    distractors.add(`(${(a * px) + d}, ${(py / b) + c})`); 
                    
                    if (b !== 1) distractors.add(`(${(px * b) + c}, ${newY})`); 
                    else distractors.add(`(${newX}, ${(py / a) + d})`); 
                    
                    while (distractors.size < 3) { distractors.add(`(${getRandomInt(-10, 10)}, ${getRandomInt(-10, 10)})`); }
                }

                // MODE 4: Inverse Points & Domains
                else if (currentMode === 4) {
                    let subType = getRandomInt(1, 2);
                    
                    if (subType === 1) { // Points
                        promptText = "Identify the inverse point:";
                        optionsAreText = false;
                        
                        let px = getRandomNonZero(-9, 9);
                        let py = getRandomNonZero(-9, 9);
                        
                        promptHTML = `If \\( (${px}, ${py}) \\) is on the graph of \\( f(x) \\), what point is on the graph of \\( f^{-1}(x) \\)?`;
                        
                        correctAns = `(${py}, ${px})`;
                        distractors.add(`(${-px}, ${-py})`);
                        distractors.add(`(${-py}, ${-px})`);
                        distractors.add(`\\left(\\frac{1}{${px}}, \\frac{1}{${py}}\\right)`);
                        
                        while (distractors.size < 3) { distractors.add(`(${getRandomInt(-10, 10)}, ${getRandomInt(-10, 10)})`); }
                    } else { // Domain/Range
                        promptText = "Identify the domain/range relationship:";
                        optionsAreText = true;
                        forceFullWidth = true;
                        
                        let min = getRandomInt(-5, 0);
                        let max = getRandomInt(2, 8);
                        let isDomain = Math.random() > 0.5;
                        
                        if (isDomain) {
                            promptHTML = `If the Domain of \\( f(x) \\) is \\( [${min}, ${max}] \\), what is true about \\( f^{-1}(x) \\)?`;
                            correctAns = `The Range of f⁻¹(x) is [${min}, ${max}].`;
                            distractors.add(`The Domain of f⁻¹(x) is [${min}, ${max}].`);
                            distractors.add(`The Range of f⁻¹(x) is [${-max}, ${-min}].`);
                            distractors.add(`The Domain of f⁻¹(x) is [${-max}, ${-min}].`);
                        } else {
                            promptHTML = `If the Range of \\( f(x) \\) is \\( [${min}, ${max}] \\), what is true about \\( f^{-1}(x) \\)?`;
                            correctAns = `The Domain of f⁻¹(x) is [${min}, ${max}].`;
                            distractors.add(`The Range of f⁻¹(x) is [${min}, ${max}].`);
                            distractors.add(`The Domain of f⁻¹(x) is [${-max}, ${-min}].`);
                            distractors.add(`The Range of f⁻¹(x) is [${-max}, ${-min}].`);
                        }
                    }
                }

                // MODE 5: Evaluate Composites f(g(x))
                else if (currentMode === 5) {
                    promptText = "Evaluate the composite function:";
                    optionsAreText = false;
                    
                    let a = getRandomNonZero(2, 4);
                    let b = getRandomNonZero(-5, 5);
                    let c = getRandomNonZero(1, 3);
                    let d = getRandomNonZero(-3, 3);
                    let xVal = getRandomInt(-2, 3);
                    
                    promptHTML = `Given \\( f(x) = ${a}x ${b>0?'+':'-'} ${Math.abs(b)} \\) and \\( g(x) = ${c===1?"":c}x^2 ${d>0?'+':'-'} ${Math.abs(d)} \\), find \\( f(g(${xVal})) \\)`;
                    
                    let g_eval = c * Math.pow(xVal, 2) + d;
                    let ans = a * g_eval + b;
                    correctAns = ans.toString();
                    
                    let f_eval = a * xVal + b;
                    let trap1 = c * Math.pow(f_eval, 2) + d;
                    distractors.add(trap1.toString()); // g(f(x))
                    
                    let trap2 = f_eval * g_eval;
                    distractors.add(trap2.toString()); // f(x)*g(x)
                    
                    let bad_g = c * xVal + d;
                    let trap3 = a * bad_g + b;
                    distractors.add(trap3.toString()); // forgot square
                    
                    while (distractors.size < 3) { distractors.add((getRandomInt(-20, 20)).toString()); }
                }

                // MODE 6: Build & Break Composites
                else if (currentMode === 6) {
                    let isBuild = Math.random() > 0.5;
                    optionsAreText = true; 
                    
                    if (isBuild) {
                        promptText = "Determine the composite function expression:";
                        optionsAreText = false; 
                        let a = getRandomNonZero(2, 4);
                        let b = getRandomNonZero(-5, 5);
                        
                        promptHTML = `If \\( f(x) = x^2 \\) and \\( g(x) = ${a}x ${b>0?'+':'-'} ${Math.abs(b)} \\), what is \\( f(g(x)) \\)?`;
                        
                        correctAns = `(${a}x ${b>0?'+':'-'} ${Math.abs(b)})^2`;
                        distractors.add(`${a}x^2 ${b>0?'+':'-'} ${Math.abs(b)}`); // g(f(x))
                        distractors.add(`x^2(${a}x ${b>0?'+':'-'} ${Math.abs(b)})`); // f(x)g(x)
                        distractors.add(`${a}(x^2 ${b>0?'+':'-'} \\left| ${b} \\right|)^2`); // Messy combo
                    } else {
                        promptText = "Decompose the function into \\(f(g(x)) \\):";
                        forceFullWidth = true;
                        
                        let a = getRandomNonZero(2, 5);
                        let b = getRandomNonZero(-7, 7);
                        let inner = `${a}x ${b>0?'+':'-'} ${Math.abs(b)}`;
                        
                        promptHTML = `If \\( h(x) = \\sqrt{${inner}} \\), which gives \\( h(x) = f(g(x)) \\)?`;
                        
                        // Using a highly specific formatting span to ensure "and" looks normal but doesn't break Math formatting
                        let andStr = '<span style="font-weight:normal; margin:0 10px;">and</span>';

                        correctAns = `\\( f(x) = \\sqrt{x} \\) ${andStr} \\( g(x) = ${inner} \\)`;
                        distractors.add(`\\( f(x) = ${inner} \\) ${andStr} \\( g(x) = \\sqrt{x} \\)`); 
                        distractors.add(`\\( f(x) = x \\) ${andStr} \\( g(x) = \\sqrt{${inner}} \\)`); 
                        distractors.add(`\\( f(x) = \\sqrt{${a}x} \\) ${andStr} \\( g(x) = x ${b>0?'+':'-'} ${Math.abs(b)} \\)`); 
                    }
                    while (distractors.size < 3) { 
                        distractors.add(`\\( f(x) = x \\) <span style="font-weight:normal; margin:0 10px;">and</span> \\( g(x) = ${getRandomInt(1,5)}x \\)`); 
                    }
                }

                // MODE 7: Advanced Transformations (Factoring b)
                else if (currentMode === 7) {
                    promptText = "Analyze the advanced transformation:";
                    optionsAreText = true; 
                    forceFullWidth = true;
                    
                    let b = getRandomEl([-2, 2, 3, -3]);
                    let c_factored = getRandomNonZero(-4, 4);
                    let c_raw = b * c_factored; 
                    
                    let innerStr = `${b === -1 ? "-" : b}x ${c_raw > 0 ? '-' : '+'} ${Math.abs(c_raw)}`;
                    
                    promptHTML = `Consider the function \\( y = f(${innerStr}) \\). What is the horizontal translation?`;
                    
                    let direction = c_factored > 0 ? "Right" : "Left";
                    let amount = Math.abs(c_factored);
                    correctAns = `${direction} ${amount}`;
                    
                    let trapDir1 = c_raw > 0 ? "Right" : "Left";
                    let trapDir2 = c_raw > 0 ? "Left" : "Right";
                    distractors.add(`${trapDir1} ${Math.abs(c_raw)}`);
                    distractors.add(`${trapDir2} ${Math.abs(c_raw)}`);
                    
                    let trapDir3 = c_factored > 0 ? "Left" : "Right";
                    distractors.add(`${trapDir3} ${amount}`);
                    
                    while (distractors.size < 3) { distractors.add(`Right ${getRandomInt(5, 10)}`); }
                }

                // MODE 8: Inverse Equations & Evaluation
                else if (currentMode === 8) {
                    let subType = getRandomInt(1, 2);
                    optionsAreText = false;
                    
                    if (subType === 1) { // Quick Eval f^-1(k)
                        promptText = "Evaluate the inverse function:";
                        let m = getRandomNonZero(2, 5) * (Math.random() > 0.5 ? 1 : -1);
                        let b = getRandomNonZero(-8, 8);
                        let targetX = getRandomInt(-5, 5);
                        let k = m * targetX + b;
                        
                        promptHTML = `If \\( f(x) = ${m}x ${b>0?'+':'-'} ${Math.abs(b)} \\), find \\( f^{-1}(${k}) \\)`;
                        
                        correctAns = targetX.toString();
                        
                        distractors.add((m * k + b).toString()); // Evaled original
                        let trap2 = (k + b) / m;
                        if (Number.isInteger(trap2) && trap2 !== targetX) distractors.add(trap2.toString());
                        distractors.add((-targetX).toString());
                        
                        while (distractors.size < 3) { distractors.add((getRandomInt(-10, 10)).toString()); }
                    } else { // Find Inverse Equation
                        promptText = "Find the equation of the inverse function:";
                        
                        let m = getRandomNonZero(2, 5); 
                        let b = getRandomNonZero(-9, 9);
                        
                        promptHTML = `Find \\( f^{-1}(x) \\) for \\( f(x) = ${m}x ${b>0?'+':'-'} ${Math.abs(b)} \\)`;
                        
                        correctAns = `f^{-1}(x) = \\frac{x ${b>0?'-':'+'} ${Math.abs(b)}}{${m}}`;
                        
                        distractors.add(`f^{-1}(x) = \\frac{x ${b>0?'+':'-'} ${Math.abs(b)}}{${m}}`); 
                        distractors.add(`f^{-1}(x) = ${m}x ${b>0?'-':'+'} ${Math.abs(b)}`); 
                        distractors.add(`f^{-1}(x) = \\frac{1}{${m}x ${b>0?'+':'-'} ${Math.abs(b)}}`); 
                        
                        while (distractors.size < 3) { distractors.add(`f^{-1}(x) = \\frac{x + ${getRandomInt(1,9)}}{${m}}`); }
                    }
                }

                problemSignature = promptText + promptHTML + correctAns;
                loopCount++;

            } while (problemSignature === lastPrompt && loopCount < 10); 
            
            lastPrompt = problemSignature;

            // --- Safe DOM Updates ---
            document.getElementById('promptTitle').innerText = promptText; 
            
            let displayBox = document.getElementById('problemDisplay');
            
            // Explicitly inject the completely pre-formatted HTML (No auto-wrapping here)
            displayBox.innerHTML = promptHTML;

            // Process Options
            let options;
            
            if (currentMode === 1) {
                // Completely hardcoded for fixed locations
                options = [
                    "It is a one-to-one function.",
                    "It is a function, but NOT one-to-one.",
                    "It is a relation, but NOT a function.",
                    "It is neither a relation nor a function."
                ];
            } else {
                let finalOptions = new Set();
                finalOptions.add(correctAns);
                let distArray = Array.from(distractors);
                let i = 0;

                while(finalOptions.size < 4 && i < distArray.length) {
                    finalOptions.add(distArray[i]); i++;
                }
                
                // Fallback padding
                let pad = 1;
                while(finalOptions.size < 4) { 
                    if (optionsAreText) finalOptions.add(`Option ${pad}`); 
                    else finalOptions.add(`${pad}`);
                    pad++;
                }
                options = shuffle(Array.from(finalOptions));
            }

            const grid = document.getElementById('optionsGrid');
            grid.innerHTML = ''; 

            options.forEach(opt => {
                let btn = document.createElement('button');
                btn.className = 'option-btn';
                if (forceFullWidth || opt.length > 30) btn.classList.add('full-width');
                
                if (optionsAreText) {
                    btn.innerHTML = opt; // Plain HTML rendering (which may still contain \( \) for KaTeX)
                } else {
                    btn.innerHTML = `\\(${opt}\\)`; // KaTeX Math rendering
                }

                btn.onclick = (e) => handleGuess(btn, opt === correctAns, e);
                grid.appendChild(btn);
            });

            // Configure KaTeX to ONLY render in inline mode (display: false)
            // This prevents math blocks from creating hard line breaks in sentences.
            if (window.renderMathInElement) {
                renderMathInElement(document.getElementById('gameScreen'), { 
                    delimiters: [
                        {left: "$$", right: "$$", display: true},
                        {left: "\\(", right: "\\)", display: false}
                    ] 
                });
            }

        } catch (err) {
            console.error(err);
            document.getElementById('errorAlert').innerText = "Engine Error: " + err.message;
            document.getElementById('errorAlert').style.display = 'block';
        }
    }

    function handleGuess(btn, isCorrect, event) {
        if (isTransitioning || btn.classList.contains('wrong')) return;

        if (isCorrect) {
            isTransitioning = true;
            btn.classList.add('correct');
            playSuccess();
            
            currentStreak++;
            document.getElementById('streakDisplay').innerText = currentStreak;

            if (currentStreak > highestStreak) {
                highestStreak = currentStreak;
                document.getElementById('highStreakDisplay').innerText = highestStreak;
            }

            createSparkle(event.clientX, event.clientY);
            setTimeout(generateProblem, 1000);
        } else {
            btn.classList.add('wrong');
            playWrong();
            currentStreak = 0; 
            document.getElementById('streakDisplay').innerText = currentStreak;
            
            let display = document.getElementById('problemDisplay');
            display.classList.add('error');
            setTimeout(() => display.classList.remove('error'), 400);
        }
    }

    function createSparkle(x, y) {
        const emojis = ['\u2B50', '\uD83C\uDFAF', '\uD83D\uDE80', '\u2728', '\uD83C\uDFC6'];
        const sparkle = document.createElement('div');
        sparkle.innerText = emojis[getRandomInt(0, emojis.length - 1)];
        sparkle.className = 'confetti';
        sparkle.style.left = (x - 15) + 'px';
        sparkle.style.top = (y - 15) + 'px';
        document.body.appendChild(sparkle);
        setTimeout(() => sparkle.remove(), 1000);
    }
</script>
